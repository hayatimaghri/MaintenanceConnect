services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintenanceconnect_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
    - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: maintenanceconnect
      DB_USERNAME: maintenance
      DB_PASSWORD: maintenance

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: maintenanceconnect_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maintenanceconnect
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: maintenance
      MYSQL_PASSWORD: maintenance
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "maintenance", "-pmaintenance"]
      timeout: 5s
      retries: 10
      interval: 5s

volumes:
  mysql_data: